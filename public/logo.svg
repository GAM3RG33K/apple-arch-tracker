<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>
    <linearGradient id="appleGradient" x1="0%" y1="0%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cpuGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Outer Ambient Glow -->
  <circle cx="256" cy="270" r="160" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />

  <!-- Combined Apple/CPU Graphic -->
  <g transform="translate(141, 102) scale(0.6)">
    
    <!-- Apple Shape Glow Base -->
    <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z" 
          fill="url(#appleGradient)" opacity="0.1" filter="url(#glow)"/>
    
    <!-- Crisp Apple Outline -->
    <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z" 
          fill="none" stroke="url(#appleGradient)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#softglow)"/>

    <!-- CPU inside the Apple -->
    <g transform="translate(0, 5)">
        <!-- Outer Box -->
        <rect x="132" y="245" width="120" height="120" rx="20" fill="#040608" stroke="url(#cpuGradient)" stroke-width="12" filter="url(#softglow)"/>
        <!-- Inner Core -->
        <rect x="162" y="275" width="60" height="60" rx="10" fill="url(#cpuGradient)" />
        
        <!-- CPU Pins -->
        <g stroke="url(#cpuGradient)" stroke-width="10" stroke-linecap="round">
          <!-- Top -->
          <line x1="156" y1="220" x2="156" y2="245" />
          <line x1="192" y1="220" x2="192" y2="245" />
          <line x1="228" y1="220" x2="228" y2="245" />
          <!-- Bottom -->
          <line x1="156" y1="365" x2="156" y2="390" />
          <line x1="192" y1="365" x2="192" y2="390" />
          <line x1="228" y1="365" x2="228" y2="390" />
          <!-- Left -->
          <line x1="107" y1="269" x2="132" y2="269" />
          <line x1="107" y1="305" x2="132" y2="305" />
          <line x1="107" y1="341" x2="132" y2="341" />
          <!-- Right -->
          <line x1="252" y1="269" x2="277" y2="269" />
          <line x1="252" y1="305" x2="277" y2="305" />
          <line x1="252" y1="341" x2="277" y2="341" />
        </g>
    </g>
  </g>
</svg>
